name: Dependency Lock Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.head_ref == 'ci/dependency-security-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Atualizar somente correções compatíveis do lockfile
        run: npm audit fix --package-lock-only || true

      - name: Validar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Versionar lockfile quando necessário
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile já está atualizado."
            exit 0
          fi
          git config user.name "Kauerc"
          git config user.email "89664254+Kauerc10@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: atualiza dependências vulneráveis do lockfile"
          git push origin "HEAD:${BRANCH}"
